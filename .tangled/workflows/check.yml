when:
  - event: ["push", "pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - R
  - pandoc
  - curl
  - libuv
  - pkg-config
  - gcc
  - gnumake
  - texliveBasic
  - qpdf

steps:

  - name: "Install dependencies"
    command: |
      mkdir -p /tmp/Rlib
      R_LIBS_USER=/tmp/Rlib Rscript \
        -e "repos <- 'https://cloud.r-project.org'" \
        -e "install.packages(c('remotes', 'rcmdcheck'), lib = '/tmp/Rlib', repos = repos)" \
        -e "remotes::install_deps('.', dependencies = TRUE, lib = '/tmp/Rlib', repos = repos)"

  - name: "Run R CMD check"
    command: |
      R_LIBS_USER=/tmp/Rlib Rscript \
        -e "rcmdcheck::rcmdcheck('.', args = '--as-cran', error_on = 'warning')"
