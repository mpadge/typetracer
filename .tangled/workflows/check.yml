when:
  - event: ["push", "pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - R
  - pandoc
  - curl
  - libuv
  - pkg-config
  - gcc
  - gnumake
  - qpdf

environment:
  R_LIBS_USER: "/tmp/Rlib"

cache:
  - key: r-library
    hash: [DESCRIPTION]
    paths: [/tmp/Rlib]

steps:

  - name: "Install dependencies"
    command: |
      mkdir -p "$R_LIBS_USER"
      Rscript \
        -e "repos <- 'https://cloud.r-project.org'" \
        -e "install.packages(c('remotes', 'rcmdcheck'), repos = repos)" \
        -e "remotes::install_deps('.', dependencies = TRUE, repos = repos)"

  - name: "Run R CMD check"
    command: |
      Rscript \
        -e "rcmdcheck::rcmdcheck('.', args = c('--as-cran', '--no-manual'), error_on = 'warning')"
